name: Build CopyPad

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-swift-
          
    - name: Build Release
      run: |
        swift build -c release
        
    - name: Package Binary
      run: |
        mkdir -p artifacts
        cp .build/release/CopyPad artifacts/
        # Create archive
        tar -czf artifacts/CopyPad-${{ github.sha }}.tar.gz -C .build/release CopyPad
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: copypad-${{ github.sha }}
        path: artifacts/
        retention-days: 30
        
