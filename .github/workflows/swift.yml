name: Build CopyPad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build Release
      run: |
        xcodebuild -project CopyPad/CopyPad.xcodeproj \
          -scheme CopyPad \
          -configuration Release \
          -derivedDataPath build \
          build
        
    - name: Package Binary
      run: |
        mkdir -p artifacts
        cp build/Build/Products/Release/CopyPad.app/Contents/MacOS/CopyPad artifacts/
        # Create archive with the app bundle
        tar -czf artifacts/CopyPad-${{ github.sha }}.tar.gz -C build/Build/Products/Release CopyPad.app
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: copypad-${{ github.sha }}
        path: artifacts/
        retention-days: 30
        
